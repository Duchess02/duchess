<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duchess Studios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MAIN CONTAINER WITH BACKGROUND PORTRAIT -->
  <main class="hero-container">
    
    <!-- PORTRAIT (LAYERED BEHIND EVERYTHING) -->
    <img src="portrait.png" alt="Portrait Background" class="portrait-bg" />

    <!-- FOREGROUND CONTENT LAYER -->
    <div class="content-layer">

      <!-- HEADER: LOGO + BYLINE -->
      <header class="brand-header">
        <img src="duchess-logo.svg" alt="Duchess Studios" class="duchess-logo" />
        <span class="byline">by khizer</span>
      </header>

      <!-- MAIN HERO TEXT SECTION -->
      <section class="hero-text">
        <h1>Duchess Studios</h1>
        <p>Boutique design & creative studio bridging typography, physical utility objects, and brand identity.</p>
      </section>

      <!-- WIDGET & META SECTION -->
      <section class="widgets-wrapper">
        
        <!-- SPOTIFY API CONTAINER -->
        <div class="spotify-widget">
          <!-- PASTE YOUR SPOTIFY API EMBED / CODE HERE -->
          <div class="spotify-placeholder">
            <span>Spotify API Integration</span>
          </div>
        </div>

        <!-- DATE / TIME / LOCATION BLOCK -->
        <div class="meta-block">
          <span class="meta-item location">Toronto, ON</span>
          <span class="meta-separator">•</span>
          <span class="meta-item datetime">Jul 21, 2026 // 13:23 EDT</span>
        </div>

      </section>

    </div>
  </main>

</body>
</html>
