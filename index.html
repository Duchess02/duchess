<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duchess Studios</title>
  <style>
    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
    }

    /* ==========================================================================
       HERO CONTAINER & PORTRAIT BACKGROUND (LAYERED BEHIND TEXT)
       ========================================================================== */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      overflow: hidden;
    }

    .portrait-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      opacity: 0.35;
      pointer-events: none;
    }

    .content-layer {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: calc(100vh - 96px);
    }

    /* ==========================================================================
       HEADER: BIGGER LOGO + "BY KHIZER"
       ========================================================================== */
    .brand-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .duchess-logo {
      height: 54px;
      width: auto;
      display: block;
    }

    .byline {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: -0.02em;
      opacity: 0.8;
      white-space: nowrap;
    }

    /* ==========================================================================
       HERO TEXT
       ========================================================================== */
    .hero-text {
      max-width: 650px;
      margin: 40px 0;
    }

    .hero-text h1 {
      font-size: 42px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }

    .hero-text p {
      font-size: 18px;
      line-height: 1.5;
      color: #a0a0a0;
    }

    /* ==========================================================================
       SPOTIFY API & META BLOCK
       ========================================================================== */
    .widgets-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 400px;
    }

    .spotify-placeholder {
      width: 100%;
      height: 80px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #1db954;
    }

    .meta-block {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "SF Mono", "Courier New", Courier, monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    .meta-separator {
      opacity: 0.4;
    }

    /* ==========================================================================
       MOBILE RESPONSIVE OVERRIDES
       ========================================================================== */
    @media (max-width: 768px) {
      .hero-container {
        padding: 24px;
      }

      .content-layer {
        min-height: calc(100vh - 48px);
      }

      .brand-header {
        gap: 10px;
      }

      .duchess-logo {
        height: 38px;
      }

      .byline {
        font-size: 14px;
      }

      .hero-text h1 {
        font-size: 30px;
      }

      .hero-text p {
        font-size: 15px;
      }

      .widgets-wrapper {
        max-width: 100%;
      }

      .meta-block {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        font-size: 11px;
      }

      .meta-separator {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- MAIN CONTAINER WITH BACKGROUND PORTRAIT -->
  <main class="hero-container">
    
    <!-- PORTRAIT (LAYERED BEHIND EVERYTHING) -->
    <img src="portrait.png" alt="Portrait Background" class="portrait-bg" />

    <!-- FOREGROUND CONTENT LAYER -->
    <div class="content-layer">

      <!-- HEADER: LOGO + BYLINE -->
      <header class="brand-header">
        <img src="duchess-logo.svg" alt="Duchess Studios" class="duchess-logo" />
        <span class="byline">by khizer</span>
      </header>

      <!-- MAIN HERO TEXT SECTION -->
      <section class="hero-text">
        <h1>Duchess Studios</h1>
        <p>Boutique design & creative studio bridging typography, physical utility objects, and brand identity.</p>
      </section>

      <!-- WIDGET & META SECTION -->
      <section class="widgets-wrapper">
        
        <!-- SPOTIFY API CONTAINER -->
        <div class="spotify-widget">
          <!-- PASTE YOUR SPOTIFY API EMBED / CODE HERE -->
          <div class="spotify-placeholder">
            <span>Spotify API Integration</span>
          </div>
        </div>

        <!-- DATE / TIME / LOCATION BLOCK -->
        <div class="meta-block">
          <span class="meta-item location">Toronto, ON</span>
          <span class="meta-separator">•</span>
          <span class="meta-item datetime">Jul 21, 2026 // 13:41 EDT</span>
        </div>

      </section>

    </div>
  </main>

</body>
</html>
